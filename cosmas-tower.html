<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmos Tower // Tecnomarema</title>
  <style>
    :root {
      --bg-cosmos: #05030d;
      --bg-panel: #0b071a;
      --bg-card: #130c2b;
      --marema-mint: #12f693;
      --marema-purple: #cf30ff;
      --marema-mint-soft: rgba(18, 246, 147, 0.14);
      --marema-purple-soft: rgba(207, 48, 255, 0.16);
      --text-main: #f6f2ff;
      --text-muted: #a699cc;
      --danger: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      max-height: 100vh;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 15%, rgba(207, 48, 255, 0.18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(18, 246, 147, 0.14), transparent 45%),
        var(--bg-cosmos);
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      height: 100dvh;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .game-shell {
      position: relative;
      width: 100%;
      max-width: 530px;
      height: 100%;
      max-height: calc(100vh - 20px);
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border: 1px solid rgba(207, 48, 255, 0.38);
      border-radius: 12px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.72),
        0 0 26px rgba(207, 48, 255, 0.16),
        0 0 18px rgba(18, 246, 147, 0.08);
      overflow: hidden;
    }

    .top-hud {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-card);
      border-bottom: 1px solid rgba(207, 48, 255, 0.24);
      font-size: 11px;
    }

    .brand-link {
      color: var(--marema-mint);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .brand-link:hover {
      color: var(--marema-purple);
    }

    .brand-link span {
      color: var(--marema-purple);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .stats strong {
      color: var(--marema-mint);
    }

    .player-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      background: #080514;
      border-bottom: 1px solid rgba(18, 246, 147, 0.14);
      font-size: 11px;
    }

    .player-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .player-input-group label {
      color: var(--text-muted);
      white-space: nowrap;
    }

    .player-input {
      background: var(--bg-card);
      border: 1px solid rgba(207, 48, 255, 0.42);
      border-radius: 5px;
      color: var(--marema-mint);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      width: 100%;
      max-width: 130px;
      outline: none;
    }

    .player-input:focus {
      border-color: var(--marema-mint);
    }

    .hi-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .hi-badge {
      color: var(--marema-purple);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hi-badge strong {
      color: var(--marema-mint);
    }

    .top10-btn {
      background: var(--marema-purple-soft);
      border: 1px solid rgba(207, 48, 255, 0.55);
      color: var(--marema-mint);
      border-radius: 5px;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .top10-btn:hover {
      background: rgba(18, 246, 147, 0.18);
      border-color: var(--marema-mint);
    }

    .level-bar-wrap {
      flex-shrink: 0;
      height: 4px;
      background: #05030d;
      width: 100%;
    }

    .level-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--marema-purple), var(--marema-mint));
      transition: width 0.2s ease;
    }

    .canvas-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--bg-cosmos);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Modal Top 10 Highscores */
    .leaderboard-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(5, 3, 13, 0.88);
      backdrop-filter: blur(3px);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .leaderboard-overlay.open {
      display: flex;
    }

    .leaderboard-card {
      width: 100%;
      max-width: 390px;
      background: #0e0921;
      border: 1px solid rgba(207, 48, 255, 0.55);
      border-radius: 10px;
      box-shadow: 0 0 28px rgba(207, 48, 255, 0.25);
      padding: 14px 16px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(18, 246, 147, 0.22);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .leaderboard-header h3 {
      color: var(--marema-mint);
      font-size: 13px;
      letter-spacing: 0.6px;
    }

    .close-lb-btn {
      background: transparent;
      border: 1px solid rgba(207, 48, 255, 0.5);
      color: var(--marema-purple);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .close-lb-btn:hover {
      border-color: var(--marema-mint);
      color: var(--marema-mint);
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .lb-table th {
      text-align: left;
      color: var(--marema-purple);
      padding: 4px 6px;
      border-bottom: 1px solid rgba(207, 48, 255, 0.2);
      font-weight: 700;
    }

    .lb-table td {
      padding: 5px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .lb-table tr:first-child td {
      color: var(--marema-mint);
      font-weight: 700;
    }

    .lb-table td.pts-col,
    .lb-table th.pts-col {
      text-align: right;
    }

    .lb-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 18px 8px;
      font-size: 11px;
    }

    .reward-panel {
      display: none;
      flex-shrink: 0;
      padding: 10px 14px;
      background: #100926;
      border-top: 1px solid rgba(18, 246, 147, 0.4);
      text-align: center;
    }

    .reward-panel.visible {
      display: block;
    }

    .reward-panel h2 {
      color: var(--marema-mint);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .coupon-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--marema-mint-soft);
      border: 1px dashed var(--marema-mint);
      padding: 5px 10px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .coupon-code {
      color: var(--marema-mint);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .copy-btn {
      background: var(--marema-mint);
      color: #05030d;
      border: none;
      border-radius: 4px;
      padding: 4px 9px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-bar {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: #070412;
      border-top: 1px solid rgba(207, 48, 255, 0.16);
      font-size: 11px;
      color: var(--text-muted);
    }

    .keycap {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(18, 246, 147, 0.45);
      background: rgba(18, 246, 147, 0.12);
      color: var(--marema-mint);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="top-hud">
      <a class="brand-link" href="https://tecnomarema.com.ar/" target="_blank" rel="noopener noreferrer">
        TECNOMAREMA<span>.COM.AR</span>
      </a>
      <div class="stats">
        <div>LVL: <strong id="lvlHud">1/20</strong></div>
        <div>PTS: <strong id="scoreHud">00000</strong></div>
        <div>VIDAS: <strong id="livesHud">3</strong></div>
      </div>
    </div>

    <div class="player-bar">
      <div class="player-input-group">
        <label for="playerNameInput">JUGADOR:</label>
        <input
          id="playerNameInput"
          class="player-input"
          type="text"
          maxlength="14"
          placeholder="Tu nombre"
          autocomplete="off"
        />
      </div>
      <div class="hi-controls">
        <div class="hi-badge" id="hiHud">HI: <strong>00000</strong> (---)</div>
        <button id="openTop10Btn" class="top10-btn" type="button">★ TOP 10</button>
      </div>
    </div>

    <div class="level-bar-wrap">
      <div class="level-bar-fill" id="levelBar"></div>
    </div>

    <div class="canvas-stage">
      <canvas id="gameCanvas" width="530" height="530"></canvas>

      <!-- Modal Ranking Top 10 -->
      <div class="leaderboard-overlay" id="leaderboardOverlay">
        <div class="leaderboard-card">
          <div class="leaderboard-header">
            <h3>★ TOP 10 HIGHSCORES // MAREMA</h3>
            <button id="closeTop10Btn" class="close-lb-btn" type="button">CERRAR [ESC]</button>
          </div>
          <div id="leaderboardBody"></div>
        </div>
      </div>
    </div>

    <div class="reward-panel" id="rewardPanel">
      <h2>¡20/20 NIVELES SUPERADOS! TU 50% OFF ESTÁ LISTO</h2>
      <div class="coupon-row">
        <span class="coupon-code" id="promoCodeText">MAREMA50-COSMOS</span>
        <button class="copy-btn" id="copyCodeBtn" type="button">COPIAR</button>
      </div>
    </div>

    <div class="footer-bar">
      <div>
        <span class="keycap">←</span> <span class="keycap">→</span> Mover &nbsp;
        <span class="keycap">↑</span> Propulsor
      </div>
      <div id="statusHud">INICIO</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const lvlHud = document.getElementById("lvlHud");
    const scoreHud = document.getElementById("scoreHud");
    const livesHud = document.getElementById("livesHud");
    const levelBar = document.getElementById("levelBar");
    const statusHud = document.getElementById("statusHud");
    const rewardPanel = document.getElementById("rewardPanel");
    const promoCodeText = document.getElementById("promoCodeText");
    const copyCodeBtn = document.getElementById("copyCodeBtn");
    const playerNameInput = document.getElementById("playerNameInput");
    const hiHud = document.getElementById("hiHud");

    const openTop10Btn = document.getElementById("openTop10Btn");
    const closeTop10Btn = document.getElementById("closeTop10Btn");
    const leaderboardOverlay = document.getElementById("leaderboardOverlay");
    const leaderboardBody = document.getElementById("leaderboardBody");

    // Configuración editable de marca y promo
    const PROMO_CODE = "MAREMA50-COSMOS";
    const CUSTOM_LOGO_URL = ""; // Opcional: pon aquí la URL o ruta de tu logo si querés reemplazar el hexágono TM vectorial
    const STORAGE_KEY_TOP10 = "tecnomarema_cosmos_top10_v1";
    const STORAGE_KEY_NAME = "tecnomarema_cosmos_player_v1";

    const MAX_LEVEL = 20;
    const W = canvas.width;
    const H = canvas.height;

    const MINT = "#12f693";
    const PURPLE = "#cf30ff";
    const DANGER = "#ff3366";

    promoCodeText.textContent = PROMO_CODE;

    let customLogoImg = null;
    let customLogoLoaded = false;
    if (CUSTOM_LOGO_URL) {
      customLogoImg = new Image();
      customLogoImg.onload = () => {
        customLogoLoaded = true;
      };
      customLogoImg.src = CUSTOM_LOGO_URL;
    }

    let playerName = (localStorage.getItem(STORAGE_KEY_NAME) || "PILOTO").trim().toUpperCase() || "PILOTO";
    playerNameInput.value = playerName;

    function loadTop10() {
      try {
        const list = JSON.parse(localStorage.getItem(STORAGE_KEY_TOP10));
        if (Array.isArray(list)) {
          return list
            .filter((item) => item && typeof item.score === "number")
            .sort((a, b) => b.score - a.score)
            .slice(0, 10);
        }
      } catch (_) {}
      return [];
    }

    let top10List = loadTop10();

    function saveRunToTop10(name, finalScore, reachedLevel) {
      const cleanScore = Math.floor(finalScore);
      if (cleanScore <= 0) return;

      top10List.push({
        name: name || "PILOTO",
        score: cleanScore,
        level: reachedLevel
      });

      top10List.sort((a, b) => b.score - a.score);
      top10List = top10List.slice(0, 10);
      localStorage.setItem(STORAGE_KEY_TOP10, JSON.stringify(top10List));
      renderLeaderboard();
    }

    function renderLeaderboard() {
      if (top10List.length === 0) {
        leaderboardBody.innerHTML = `<div class="lb-empty">Todavía no hay puntajes registrados.<br>¡Jugá una partida para entrar al Top 10!</div>`;
        return;
      }

      const rowsHtml = top10List
        .map(
          (entry, idx) => `
          <tr>
            <td>#${idx + 1}</td>
            <td>${entry.name}</td>
            <td>LVL ${entry.level}</td>
            <td class="pts-col">${formatPts(entry.score)}</td>
          </tr>
        `
        )
        .join("");

      leaderboardBody.innerHTML = `
        <table class="lb-table">
          <thead>
            <tr>
              <th>POS</th>
              <th>JUGADOR</th>
              <th>NIVEL</th>
              <th class="pts-col">PUNTOS</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
    }

    const keys = { left: false, right: false, up: false };

    // Estados: "START" | "PLAYING" | "LEVEL_UP" | "GAME_OVER" | "WIN"
    let state = "START";
    let level = 1;
    let lives = 3;
    let score = 0;
    let climbedHeight = 0;
    let targetHeight = 800;
    let cameraScrollSpeed = 1.0;
    let boostCharge = 1;
    let platforms = [];
    let particles = [];
    let trail = [];

    const stars = Array.from({ length: 95 }, (_, idx) => {
      const layer = idx % 3;
      const tintRoll = idx % 7;
      let color = "#f6f2ff";
      if (tintRoll === 0 || tintRoll === 1) color = MINT;
      else if (tintRoll === 2 || tintRoll === 3) color = PURPLE;

      return {
        x: Math.random() * W,
        y: Math.random() * H,
        size: layer === 0 ? 1.1 : layer === 1 ? 1.8 : 2.5,
        speed: layer === 0 ? 0.25 : layer === 1 ? 0.65 : 1.25,
        twinklePhase: Math.random() * Math.PI * 2,
        color
      };
    });

    const nebulae = [
      { x: W * 0.22, y: H * 0.28, r: 135, color: "rgba(207, 48, 255, 0.11)", drift: 0.18 },
      { x: W * 0.78, y: H * 0.68, r: 150, color: "rgba(18, 246, 147, 0.08)", drift: 0.14 }
    ];

    const player = {
      x: W / 2 - 14,
      y: H - 80,
      w: 28,
      h: 28,
      vx: 0,
      vy: 0,
      moveSpeed: 5.4,
      gravity: 0.42,
      bounceVy: -11.4,
      boostUsedThisAir: false
    };

    function drawRoundedBox(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function formatPts(val) {
      return String(Math.floor(val)).padStart(5, "0");
    }

    function syncHighScore() {
      const bestSaved = top10List.length > 0 ? top10List[0] : { score: 0, name: "---" };
      if (score > bestSaved.score) {
        hiHud.innerHTML = `HI: <strong>${formatPts(score)}</strong> (${playerName})`;
      } else {
        hiHud.innerHTML = `HI: <strong>${formatPts(bestSaved.score)}</strong> (${bestSaved.name})`;
      }
    }

    function getLevelSettings(lvl) {
      return {
        targetHeight: 780 + (lvl - 1) * 125,
        autoRise: 0.92 + (lvl - 1) * 0.1,
        movingChance: lvl < 2 ? 0 : Math.min(0.45, 0.1 + (lvl - 2) * 0.02),
        fragileChance: lvl < 4 ? 0 : Math.min(0.32, 0.08 + (lvl - 4) * 0.015),
        boostChance: 0.16,
        platGap: Math.min(78, 54 + (lvl - 1) * 1.1)
      };
    }

    function createPlatform(y, lvlSettings) {
      const w = Math.max(64, 96 - Math.floor((level - 1) * 1.3));
      const x = Math.random() * (W - w - 24) + 12;

      let type = "normal";
      const r = Math.random();
      if (r < lvlSettings.boostChance) {
        type = "boost";
      } else if (r < lvlSettings.boostChance + lvlSettings.movingChance) {
        type = "moving";
      } else if (r < lvlSettings.boostChance + lvlSettings.movingChance + lvlSettings.fragileChance) {
        type = "fragile";
      }

      return {
        x,
        y,
        w,
        h: 11,
        type,
        vx: type === "moving" ? (Math.random() < 0.5 ? -1 : 1) * (1.25 + level * 0.09) : 0,
        broken: false
      };
    }

    function initLevel(targetLvl) {
      level = targetLvl;
      const cfg = getLevelSettings(level);
      targetHeight = cfg.targetHeight;
      cameraScrollSpeed = cfg.autoRise;
      climbedHeight = 0;
      boostCharge = 1;
      particles = [];
      trail = [];

      platforms = [
        {
          x: W / 2 - 64,
          y: H - 40,
          w: 128,
          h: 11,
          type: "normal",
          vx: 0,
          broken: false
        }
      ];

      let currY = H - 40 - cfg.platGap;
      while (currY > -60) {
        platforms.push(createPlatform(currY, cfg));
        currY -= cfg.platGap;
      }

      player.x = W / 2 - player.w / 2;
      player.y = H - 40 - player.h - 2;
      player.vx = 0;
      player.vy = player.bounceVy;
      player.boostUsedThisAir = false;

      state = "PLAYING";
      statusHud.textContent = `NIVEL ${level}`;
      updateHUD();
    }

    function startNewGame() {
      playerName = (playerNameInput.value || "PILOTO").trim().toUpperCase() || "PILOTO";
      playerNameInput.value = playerName;
      localStorage.setItem(STORAGE_KEY_NAME, playerName);

      lives = 3;
      score = 0;
      rewardPanel.classList.remove("visible");
      syncHighScore();
      initLevel(1);
    }

    function spawnBurst(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const spd = 1.4 + Math.random() * 3.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          size: 2.5 + Math.random() * 2.5,
          life: 22 + Math.random() * 10,
          color
        });
      }
    }

    function updateHUD() {
      lvlHud.textContent = `${level}/${MAX_LEVEL}`;
      scoreHud.textContent = formatPts(score);
      livesHud.textContent = lives;
      const pct = Math.min(100, Math.floor((climbedHeight / targetHeight) * 100));
      const totalPct = (((level - 1) + (state === "WIN" ? 1 : pct / 100)) / MAX_LEVEL) * 100;
      levelBar.style.width = `${Math.min(100, totalPct)}%`;
      syncHighScore();
    }

    function updateCosmos(deltaScroll) {
      for (const neb of nebulae) {
        neb.y += neb.drift + deltaScroll * 0.12;
        if (neb.y - neb.r > H) {
          neb.y = -neb.r;
        }
      }

      for (const st of stars) {
        st.y += st.speed + deltaScroll * (st.speed * 0.45);
        st.twinklePhase += 0.05;
        if (st.y > H + 4) {
          st.y = -4;
          st.x = Math.random() * W;
        }
      }
    }

    function update() {
      const cfg = getLevelSettings(level);
      const cosmosBoost = (state === "PLAYING" && !leaderboardOverlay.classList.contains("open"))
        ? cameraScrollSpeed * 0.6
        : 0.45;
      updateCosmos(cosmosBoost);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (state !== "PLAYING" || leaderboardOverlay.classList.contains("open")) return;

      if (keys.left && !keys.right) {
        player.vx = -player.moveSpeed;
      } else if (keys.right && !keys.left) {
        player.vx = player.moveSpeed;
      } else {
        player.vx *= 0.78;
      }

      player.x += player.vx;

      if (player.x + player.w < 0) player.x = W;
      if (player.x > W) player.x = -player.w;

      boostCharge = Math.min(1, boostCharge + 0.008);
      if (keys.up && !player.boostUsedThisAir && boostCharge >= 0.5 && player.vy > -4) {
        player.vy = -8.5;
        player.boostUsedThisAir = true;
        boostCharge = Math.max(0, boostCharge - 0.5);
        spawnBurst(player.x + player.w / 2, player.y + player.h, MINT, 9);
      }

      player.vy += player.gravity;
      player.y += player.vy;

      trail.push({ x: player.x, y: player.y, w: player.w, h: player.h, alpha: 0.36 });
      if (trail.length > 6) trail.shift();
      for (const t of trail) t.alpha *= 0.8;

      if (player.vy > 0) {
        for (const plat of platforms) {
          if (plat.broken) continue;

          const withinX = player.x + player.w - 4 > plat.x && player.x + 4 < plat.x + plat.w;
          const withinY =
            player.y + player.h >= plat.y &&
            player.y + player.h <= plat.y + plat.h + Math.max(6, player.vy + 2);

          if (withinX && withinY) {
            if (plat.type === "fragile") {
              plat.broken = true;
              player.vy = player.bounceVy * 0.92;
              score += 15 * level;
              spawnBurst(plat.x + plat.w / 2, plat.y, DANGER, 8);
            } else if (plat.type === "boost") {
              player.vy = player.bounceVy * 1.3;
              score += 30 * level;
              spawnBurst(plat.x + plat.w / 2, plat.y, MINT, 12);
            } else {
              player.vy = player.bounceVy;
              score += 10 * level;
              spawnBurst(plat.x + plat.w / 2, plat.y, PURPLE, 6);
            }

            player.y = plat.y - player.h;
            player.boostUsedThisAir = false;
            break;
          }
        }
      }

      let riseDelta = cameraScrollSpeed;
      if (player.y < H * 0.42) {
        riseDelta = Math.max(riseDelta, H * 0.42 - player.y);
      }

      player.y += riseDelta;
      climbedHeight += riseDelta;
      score += riseDelta * 0.35;

      for (let i = platforms.length - 1; i >= 0; i--) {
        const plat = platforms[i];
        plat.y += riseDelta;

        if (plat.type === "moving") {
          plat.x += plat.vx;
          if (plat.x <= 8 || plat.x + plat.w >= W - 8) {
            plat.vx *= -1;
          }
        }

        if (plat.y > H + 24) {
          platforms.splice(i, 1);
          const highestY = platforms.reduce((minY, p) => Math.min(minY, p.y), 0);
          platforms.push(createPlatform(highestY - cfg.platGap, cfg));
        }
      }

      if (climbedHeight >= targetHeight) {
        climbedHeight = targetHeight;
        score += 250 * level;
        updateHUD();

        if (level >= MAX_LEVEL) {
          state = "WIN";
          statusHud.textContent = "20/20 COMPLETADO";
          saveRunToTop10(playerName, score, MAX_LEVEL);
          updateHUD();
          rewardPanel.classList.add("visible");
        } else {
          state = "LEVEL_UP";
          statusHud.textContent = `NIVEL ${level} SUPERADO`;
        }
        return;
      }

      if (player.y > H + 12) {
        lives--;
        updateHUD();
        if (lives <= 0) {
          lives = 0;
          state = "GAME_OVER";
          statusHud.textContent = "GAME OVER";
          saveRunToTop10(playerName, score, level);
          updateHUD();
        } else {
          initLevel(level);
        }
        return;
      }

      updateHUD();
    }

    function drawCosmosBackground() {
      ctx.fillStyle = "#05030d";
      ctx.fillRect(0, 0, W, H);

      for (const neb of nebulae) {
        const grad = ctx.createRadialGradient(neb.x, neb.y, 10, neb.x, neb.y, neb.r);
        grad.addColorStop(0, neb.color);
        grad.addColorStop(1, "rgba(5, 3, 13, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(neb.x, neb.y, neb.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const st of stars) {
        const alpha = 0.45 + 0.55 * Math.sin(st.twinklePhase);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = st.color;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      const pct = Math.min(1, climbedHeight / targetHeight);
      const trackX = W - 11;
      const trackTop = 18;
      const trackH = H - 36;

      ctx.fillStyle = "rgba(207, 48, 255, 0.18)";
      ctx.fillRect(trackX, trackTop, 4, trackH);

      ctx.fillStyle = MINT;
      ctx.fillRect(trackX, trackTop + trackH * (1 - pct), 4, trackH * pct);
    }

    function drawPlatforms() {
      for (const plat of platforms) {
        if (plat.broken) continue;

        ctx.save();
        if (plat.type === "boost") {
          ctx.fillStyle = MINT;
          ctx.shadowColor = MINT;
          ctx.shadowBlur = 10;
        } else if (plat.type === "fragile") {
          ctx.fillStyle = DANGER;
          ctx.shadowColor = DANGER;
          ctx.shadowBlur = 6;
        } else if (plat.type === "moving") {
          ctx.fillStyle = PURPLE;
          ctx.shadowColor = PURPLE;
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = "#b55cff";
          ctx.shadowColor = PURPLE;
          ctx.shadowBlur = 6;
        }

        drawRoundedBox(plat.x, plat.y, plat.w, plat.h, 5);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawPlayer() {
      for (const t of trail) {
        ctx.fillStyle = `rgba(18, 246, 147, ${t.alpha * 0.35})`;
        ctx.fillRect(t.x, t.y, t.w, t.h);
      }

      ctx.save();
      ctx.fillStyle = MINT;
      ctx.shadowColor = MINT;
      ctx.shadowBlur = 12;
      drawRoundedBox(player.x, player.y, player.w, player.h, 6);
      ctx.fill();

      ctx.shadowBlur = 6;
      ctx.shadowColor = PURPLE;
      ctx.fillStyle = PURPLE;
      const visorX = player.vx < -0.5 ? player.x + 4 : player.vx > 0.5 ? player.x + 13 : player.x + 8;
      ctx.fillRect(visorX, player.y + 8, 11, 6);
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 32);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawHexLogo(cx, cy, radius) {
      ctx.save();
      ctx.translate(cx, cy);

      if (customLogoLoaded && customLogoImg) {
        const size = radius * 2.1;
        ctx.drawImage(customLogoImg, -size / 2, -size / 2, size, size);
        ctx.restore();
        return;
      }

      ctx.shadowColor = MINT;
      ctx.shadowBlur = 18;
      ctx.fillStyle = MINT;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#080514";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#06040f";
      ctx.font = `900 ${Math.round(radius * 0.72)}px ui-monospace, monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("TM", 0, 2);
      ctx.restore();
    }

    function drawStartScreen() {
      const boxX = 28;
      const boxY = 24;
      const boxW = W - 56;
      const boxH = H - 48;

      ctx.save();
      ctx.fillStyle = "rgba(8, 5, 20, 0.86)";
      ctx.strokeStyle = "rgba(207, 48, 255, 0.45)";
      ctx.lineWidth = 1.5;
      drawRoundedBox(boxX, boxY, boxW, boxH, 12);
      ctx.fill();
      ctx.stroke();

      drawHexLogo(W / 2, boxY + 58, 36);

      ctx.textAlign = "center";
      ctx.fillStyle = MINT;
      ctx.font = "bold 19px monospace";
      ctx.fillText("COSMOS TOWER // 20 NIVELES", W / 2, boxY + 116);

      ctx.fillStyle = PURPLE;
      ctx.font = "bold 12px monospace";
      ctx.fillText("COMPLETÁ LOS 20 NIVELES Y GANÁ 50% OFF", W / 2, boxY + 138);

      const infoX = boxX + 22;
      const infoY = boxY + 158;
      const infoW = boxW - 44;
      const infoH = 198;

      ctx.fillStyle = "rgba(19, 12, 43, 0.9)";
      ctx.strokeStyle = "rgba(18, 246, 147, 0.25)";
      ctx.lineWidth = 1;
      drawRoundedBox(infoX, infoY, infoW, infoH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.fillStyle = MINT;
      ctx.font = "bold 12px monospace";
      ctx.fillText("¿CÓMO JUGAR?", infoX + 14, infoY + 24);

      ctx.fillStyle = "#f6f2ff";
      ctx.font = "11px monospace";
      ctx.fillText("• Flechas [←] [→]: Movete y controlá cada rebote.", infoX + 14, infoY + 48);
      ctx.fillText("• Flecha [↑]: Propulsor extra en el aire.", infoX + 14, infoY + 68);
      ctx.fillText("• Subí la torre antes de caer al vacío cósmico.", infoX + 14, infoY + 88);

      ctx.fillStyle = PURPLE;
      ctx.font = "bold 11px monospace";
      ctx.fillText("PLATAFORMAS:", infoX + 14, infoY + 114);

      ctx.fillStyle = MINT;
      ctx.font = "11px monospace";
      ctx.fillText("■ Verde: Súper impulso hacia arriba", infoX + 14, infoY + 134);

      ctx.fillStyle = "#d278ff";
      ctx.fillText("■ Púrpura: Base normal o móvil", infoX + 14, infoY + 154);

      ctx.fillStyle = DANGER;
      ctx.fillText("■ Rojo: Frágil (se rompe al pisar)", infoX + 14, infoY + 174);

      const pulse = 0.75 + 0.25 * Math.sin(Date.now() * 0.007);
      ctx.textAlign = "center";
      ctx.globalAlpha = pulse;
      ctx.fillStyle = MINT;
      ctx.font = "bold 14px monospace";
      ctx.fillText("PRESIONÁ [↑] PARA DESPEGAR", W / 2, boxY + boxH - 22);
      ctx.restore();
    }

    function drawOverlay() {
      if (state === "PLAYING") return;

      if (state === "START") {
        drawStartScreen();
        return;
      }

      ctx.save();
      ctx.fillStyle = "rgba(5, 3, 13, 0.82)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";

      if (state === "LEVEL_UP") {
        ctx.fillStyle = MINT;
        ctx.font = "bold 22px monospace";
        ctx.fillText(`NIVEL ${level} SUPERADO`, W / 2, H / 2 - 18);

        ctx.fillStyle = PURPLE;
        ctx.font = "13px monospace";
        ctx.fillText(`Presioná [↑] para el Nivel ${level + 1}`, W / 2, H / 2 + 16);
      } else if (state === "GAME_OVER") {
        ctx.fillStyle = DANGER;
        ctx.font = "bold 22px monospace";
        ctx.fillText(`CAÍSTE EN EL NIVEL ${level}`, W / 2, H / 2 - 22);

        ctx.fillStyle = MINT;
        ctx.font = "13px monospace";
        ctx.fillText(`${playerName}: ${formatPts(score)} PTS`, W / 2, H / 2 + 6);

        ctx.fillStyle = PURPLE;
        ctx.font = "12px monospace";
        ctx.fillText("Presioná [↑] para reintentar", W / 2, H / 2 + 34);
      } else if (state === "WIN") {
        drawHexLogo(W / 2, H / 2 - 72, 30);

        ctx.fillStyle = MINT;
        ctx.font = "bold 20px monospace";
        ctx.fillText("¡20 / 20 NIVELES LOGRADOS!", W / 2, H / 2 - 14);

        ctx.fillStyle = PURPLE;
        ctx.font = "13px monospace";
        ctx.fillText(`Puntaje: ${formatPts(score)} — Cupón 50% OFF abajo`, W / 2, H / 2 + 18);
      }

      ctx.restore();
    }

    function loop() {
      update();
      drawCosmosBackground();
      drawPlatforms();
      drawParticles();
      drawPlayer();
      drawOverlay();
      requestAnimationFrame(loop);
    }

    openTop10Btn.addEventListener("click", () => {
      renderLeaderboard();
      leaderboardOverlay.classList.add("open");
    });

    closeTop10Btn.addEventListener("click", () => {
      leaderboardOverlay.classList.remove("open");
    });

    leaderboardOverlay.addEventListener("click", (e) => {
      if (e.target === leaderboardOverlay) {
        leaderboardOverlay.classList.remove("open");
      }
    });

    playerNameInput.addEventListener("input", () => {
      playerName = (playerNameInput.value || "PILOTO").trim().toUpperCase() || "PILOTO";
      localStorage.setItem(STORAGE_KEY_NAME, playerName);
    });

    playerNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        playerNameInput.blur();
      }
      e.stopPropagation();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && leaderboardOverlay.classList.contains("open")) {
        leaderboardOverlay.classList.remove("open");
        return;
      }

      if (leaderboardOverlay.classList.contains("open")) return;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code === "ArrowLeft") keys.left = true;
      else if (e.code === "ArrowRight") keys.right = true;
      else if (e.code === "ArrowUp") {
        keys.up = true;
        if (state === "START" || state === "GAME_OVER" || state === "WIN") {
          startNewGame();
        } else if (state === "LEVEL_UP") {
          initLevel(level + 1);
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft") keys.left = false;
      else if (e.code === "ArrowRight") keys.right = false;
      else if (e.code === "ArrowUp") keys.up = false;
    });

    copyCodeBtn.addEventListener("click", () => {
      navigator.clipboard?.writeText(PROMO_CODE);
      copyCodeBtn.textContent = "¡COPIADO!";
      setTimeout(() => {
        copyCodeBtn.textContent = "COPIAR";
      }, 1800);
    });

    renderLeaderboard();
    updateHUD();
    loop();
  </script>
</body>
